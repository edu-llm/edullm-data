[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "edullm-data"
version = "0.9.1"
description = "Publisher, validator, and reader for the eduLLM Dataset Standard v1"
readme = "README.md"
# 3.10, not 3.11. The floor exists to be installable ALONGSIDE OLMo-core, whose own floor is
# 3.10 (pinned by one of its tests), and a 3.11 pin here makes the two uninstallable in one
# environment — which is the environment that actually trains on these datasets.
#
# Verified, not assumed: the full suite passes on CPython 3.10.20, and the package uses no
# 3.11-only construct (no ExceptionGroup/except*, no typing.Self, no tomllib, no StrEnum, no
# assert_never, no @override, no datetime.UTC). `from __future__ import annotations` is at the
# top of every module, so the PEP-604/585 annotations are strings at runtime on 3.10.
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "eduLLM", email = "edullm-data@alphaaiengineering.com" }]
keywords = ["dataset", "manifest", "validation", "s3"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Private :: Do Not Upload",
]
dependencies = [
  "boto3",
  # An unpinned `numpy` resolves at RUN TIME inside a Batch container, so the version that runs
  # in production is whatever PyPI served that morning — on 2026-07-31 that was numpy 2.5.1
  # against pyarrow 25.0.0, a pairing this suite has never tested. Pinning makes the deployed
  # environment reproducible, which is worth doing on its own.
  #
  # ⚠️ THIS IS NOT THE SEGFAULT FIX, and it never was. Pinning to 2.4.6 was tried against the
  # live array job and the crash was IDENTICAL. The real cause was pyarrow's `pre_buffer=True`
  # default dispatching range reads to Arrow's native C++ IO thread pool — fixed in
  # `ingest_reservoir._scan_ids`. This bound is reproducibility hygiene only. See
  # artifacts/reservoir/SEGFAULT-INVESTIGATION.md; ten hypotheses were tested, and citing a
  # refuted one as settled is how the next person loses an afternoon.
  "numpy<2.5",
  # `tokenizers` DECIDES EVERY TOKEN ID IN THE CORPUS and was declared nowhere — resolved at
  # container-build time to whatever PyPI served that morning, exactly the hazard the numpy note
  # above exists to prevent. It matters MORE here, because the two failure modes are not alike: a
  # numpy mismatch crashes, while a tokenizer change silently emits DIFFERENT ids that stay inside
  # the vocabulary and decode cleanly. Every check this package owns would pass on the wrong bytes.
  #
  # Where the bounds come from, and why they are not "whatever is installed":
  #
  # * `>=0.21` is the FLOOR because 0.20.x resolves `\p{L}`/`\p{N}` through Oniguruma's Unicode 14
  #   tables while later versions use newer ones, and the upstream maintainer closed that
  #   divergence as WONTFIX. Two builds of the same document set on two mornings can therefore
  #   disagree on recently-assigned codepoints, by design, with no gate of ours able to see it.
  # * `<0.23` is the CEILING because 0.22.2 is what this suite runs against (VERIFIED by execution
  #   in this environment) and 0.23.x is untested here. A minor bump in a Rust tokenizer is not a
  #   safe-by-default upgrade for a corpus that is content-addressed and frozen once published:
  #   a divergence found after the fact is a full re-copy, not a patch.
  #
  # This is a REPRODUCIBILITY bound, not a claim that 0.21–0.22 are byte-identical to each other.
  # Nobody has run that differential; the range narrows the risk, and the version recorded in the
  # build receipt is what actually names the implementation a given corpus was produced with.
  #
  # It is a hard dependency, not an extra, even though only `corpus_build.py:631` imports it (and
  # does so inside a function). An optional-extra tokenizer is a dependency that is absent exactly
  # where it matters most — the Batch build container — and it would fail hours into a multi-hour
  # job instead of at install time.
  "tokenizers>=0.21,<0.23",
  # ⚠️ FOUND BY THE CHECK ADDED FOR `tokenizers` ABOVE, not by the task that added it:
  # `pyarrow` was undeclared too, imported by `corpus_read.py` and `ingest_reservoir.py`. The code
  # had already NOTICED without anyone acting on it — `corpus_read.py:404` reads "production
  # resolved pyarrow 25.0.0 unpinned (`pyproject.toml:29`)", citing a line that declares numpy.
  #
  # This is the package that SEGFAULTED the live array job (`pre_buffer=True` dispatching range
  # reads to Arrow's native C++ IO pool; exit 139 in 3 of 4 children). The call sites now pass
  # `pre_buffer=False` explicitly precisely because the default is a per-API, per-version accident:
  # measured on 24.0.0, `ParquetFile.__init__` defaults False while `pq.read_table` defaults True.
  # An unpinned major can move any of those defaults again.
  #
  # The bounds are the versions actually RUN, and nothing wider: 24.0.0 is what this suite executes
  # against (verified in this environment) and 25.0.0 is what production resolved. Below 24 is
  # untested by anyone here, and 26 does not exist yet.
  "pyarrow>=24,<26",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
# `edullm-data = "edullm_data.cli:main"` used to be declared here and `edullm_data/cli.py` HAS
# NEVER EXISTED (no such file in any commit). `pip install` succeeded and the installed script
# died with ModuleNotFoundError the first time anyone ran it — a console script that has never
# been executed once, which is precisely the "asserts a field is present" decoration the golden
# rule is against, in packaging form.
#
# Replaced with the two entry points that are REAL: both are tested `main()` functions, and
# both already announce these exact names via argparse `prog=`, so the names were being promised
# to anyone who ran `--help` while resolving to nothing on the PATH. Now the declaration is
# checkable — `pip install <wheel> && wu-fsck --help` either works or the build is broken.
#
# `python -m edullm_data.validate` (what the Batch job definitions and the Dockerfile
# ENTRYPOINT actually invoke) is unaffected — these are an addition, not a replacement.
edullm-data-validate = "edullm_data.validate:main"
wu-fsck = "edullm_data.fsck:main"
# Build driver for pretrain/reservoir-dolma2 (§5.6 phase 0 + §9.7 item 4). Declared for the same
# reason as the two above — it announces this prog= in its own --help. Note it is a BUILD tool,
# not part of the publishing library: it writes no manifest, and its IAM role cannot write
# edullm-data.
edullm-ingest-reservoir = "edullm_data.ingest_reservoir:main"
# The §5.6 phase-1 build driver: plan -> run (a Batch array child) -> verify. Same class of tool as
# the one above and the same reason for declaring it: it announces this prog= in its own --help, so
# the name is either on the PATH or the build is broken. It writes shards and receipts to
# edullm-landing only; its role cannot write edullm-data at all.
edullm-corpus-build = "edullm_data.corpus_build:main"
# The PRM800K vendor ingester: stream the four upstream files into landing staging with byte and
# digest witnesses. Same class of BUILD tool as the two above, declared for the same reason.
edullm-prm800k-ingest = "edullm_data.ingest_prm800k:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edullm_data"]

# families/ MUST travel in the wheel. It lives at the repo root (it is standard content, not
# code), so a path-relative lookup resolves to nothing once the package is installed into
# site-packages — which is how the validator actually runs on Batch (`pip install <wheel> &&
# python -m edullm_data.validate`). Without this, every family-declared bound silently falls
# back to the profile's own laxer constant in production while passing in a checkout, which is
# exactly the failure that shipped: the live corpus was validated at 50% EOS / 50% zeros
# instead of the family's 5% / 1%.
#
# force-include maps the root directory into the package so `importlib.resources` /
# `Path(__file__).parent / "families"` finds it in both layouts.
[tool.hatch.build.targets.wheel.force-include]
"families" = "edullm_data/families"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "infra", "families", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# src-layout: keeps `python -m pytest` working without an editable install, which is
# the documented fallback for network-less / externally-managed environments.
pythonpath = ["src"]
# `-m "not network"`: the default run stays offline and deterministic. Network tests are OPT-IN via
# `-m network`, because a suite that silently depends on the internet fails for the wrong reason in
# CI and passes for the wrong reason on a laptop with a warm DNS cache.
addopts = "-ra -m 'not network'"
markers = [
  # Hits a live upstream (the HuggingFace tree API). Read-only, no bulk data, no S3, no credentials.
  # Exists because a registry `config` that 404s is INVISIBLE to every offline test: the row parses,
  # the plan builds, `plan_id` is stable, and the failure arrives inside a billing Batch container
  # on the first read. One row of 133 shipped that way (`cosmopedia`, E17).
  "network: requires outbound HTTPS to an upstream dataset host (opt in with `-m network`)",
]
